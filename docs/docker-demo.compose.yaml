name: helios-gateway-demo

services:
  firebase-emulator:
    image: matthewkrupnik/docker-firestore-emulator-with-ui:1.0.20
    entrypoint:
      - /bin/sh
      - -lc
      - |
        cat > firebase.json <<'JSON'
        {
          "firestore": {
            "rules": "firestore.rules"
          },
          "emulators": {
            "auth": { "host": "0.0.0.0", "port": 9099 },
            "firestore": { "host": "0.0.0.0", "port": 8080, "websocketPort": 5005 },
            "pubsub": { "host": "0.0.0.0", "port": 8085 },
            "ui": { "enabled": true, "host": "0.0.0.0", "port": 4001 }
          }
        }
        JSON
        cat > firestore.rules <<'RULES'
        rules_version = "2";
        service cloud.firestore {
          match /databases/{database}/documents {
            match /{document=**} {
              allow read, write: if true;
            }
          }
        }
        RULES
        firebase emulators:start --only auth,firestore,pubsub --project helios-demo
    ports:
      - "4001:4001"
      - "8080:8080"
      - "8085:8085"
      - "9099:9099"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:9099/emulator/v1/projects/helios-demo/config', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  firebase-auth-seed:
    image: node:20-bookworm
    working_dir: /workspace
    environment:
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
      GCLOUD_PROJECT: helios-demo
      GOOGLE_CLOUD_PROJECT: helios-demo
    command:
      - /bin/sh
      - -lc
      - |
        npm install firebase-admin@12.7.0 &&
        node <<'NODE'
        const admin = require('firebase-admin');
        const users = [
          { uid: 'demo-admin-finance', email: 'admin@example.com', password: 'password123', roles: ['admin', 'finance', 'staff', 'support', 'viewer'] },
          { uid: 'demo-viewer', email: 'viewer@example.com', password: 'password123', roles: ['viewer'] },
          { uid: 'demo-staff', email: 'staff@example.com', password: 'password123', roles: ['staff', 'viewer'] },
          { uid: 'demo-support', email: 'support@example.com', password: 'password123', roles: ['support', 'viewer'] },
        ];

        admin.initializeApp({ projectId: 'helios-demo' });

        async function upsertUser(user) {
          let record;
          try {
            record = await admin.auth().getUserByEmail(user.email);
            await admin.auth().updateUser(record.uid, {
              email: user.email,
              password: user.password,
              emailVerified: true,
              disabled: false,
            });
          } catch (error) {
            if (error.code !== 'auth/user-not-found') throw error;
            record = await admin.auth().createUser({
              uid: user.uid,
              email: user.email,
              password: user.password,
              emailVerified: true,
              disabled: false,
            });
          }
          await admin.auth().setCustomUserClaims(record.uid, { roles: user.roles });
          console.log('Seeded ' + user.email + ': ' + user.roles.join(','));
        }

        Promise.all(users.map(upsertUser)).catch((error) => {
          console.error(error);
          process.exit(1);
        });
        NODE
    depends_on:
      firebase-emulator:
        condition: service_healthy

  helios-gateway:
    image: zizitop13/helios-gateway:latest
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      DISCOVERY_MODE: docker
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      GRAPH_NAME: pet-shop
      GRAPH_LABEL_KEY: graph
      FIREBASE_PROJECT_ID: helios-demo
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
      FIRESTORE_EMULATOR_HOST: firebase-emulator:8080
      SUPER_ADMIN_ID: admin@example.com
      ADMIN_CONSOLE_ENABLED: "true"
      ADMIN_CONSOLE_FIREBASE_API_KEY: demo-api-key
      ADMIN_CONSOLE_FIREBASE_AUTH_DOMAIN: localhost
      ADMIN_CONSOLE_FIREBASE_PROJECT_ID: helios-demo
      ADMIN_CONSOLE_FIREBASE_APP_ID: 1:123456789:web:helios-demo
      ADMIN_CONSOLE_FIREBASE_AUTH_EMULATOR_URL: http://localhost:9099
      ENABLE_APOLLO_SANDBOX: "true"
      ENABLE_SCHEMA_REFRESH: "true"
      SCHEMA_REFRESH_INTERVAL_SECONDS: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      firebase-auth-seed:
        condition: service_completed_successfully
      firebase-emulator:
        condition: service_healthy
      orders-service:
        condition: service_started
      customers-service:
        condition: service_started
      pets-service:
        condition: service_started

  orders-service:
    image: zizitop13/helios-gateway-orders-service:latest
    environment:
      PORT: "5002"
    labels:
      subgraph: "true"
      subgraph.name: orders-service
      subgraph.port: "5002"
      graph: pet-shop

  customers-service:
    image: zizitop13/helios-gateway-customers-service:latest
    environment:
      PORT: "5003"
    labels:
      subgraph: "true"
      subgraph.name: customers-service
      subgraph.port: "5003"
      graph: pet-shop

  pets-service:
    image: zizitop13/helios-gateway-pets-service:latest
    environment:
      PORT: "5001"
    labels:
      subgraph: "true"
      subgraph.name: pets-service
      subgraph.port: "5001"
      graph: pet-shop
