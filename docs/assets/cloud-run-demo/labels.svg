<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Run labels screenshot placeholder</title>
  <desc id="desc">Annotated placeholder for Cloud Run service labels.</desc>
  <rect width="1120" height="630" fill="#f8fafc"/>
  <rect x="0" y="0" width="1120" height="64" fill="#1a73e8"/>
  <text x="32" y="40" font-family="Arial, sans-serif" font-size="24" fill="#fff">Cloud Run - Labels</text>
  <rect x="96" y="112" width="928" height="360" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="128" y="154" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#24292f">Subgraph discovery labels</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="128" y="190" width="360" height="52" rx="4" fill="#eef4ff"/>
    <text x="150" y="224" fill="#24292f">subgraph = true</text>
    <rect x="128" y="260" width="360" height="52" rx="4" fill="#eef4ff"/>
    <text x="150" y="294" fill="#24292f">subgraph_name = pets-service</text>
    <rect x="128" y="330" width="360" height="52" rx="4" fill="#eef4ff"/>
    <text x="150" y="364" fill="#24292f">graph = pet-shop</text>
  </g>
  <text x="128" y="426" font-family="Arial, sans-serif" font-size="15" fill="#57606a">Set these labels on pets-service, orders-service, and customers-service.</text>
  <text x="96" y="600" font-family="Arial, sans-serif" font-size="14" fill="#57606a">Replace with the real Labels pane screenshot after configuring a Cloud Run service.</text>
</svg>
