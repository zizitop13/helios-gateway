<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Run variables screenshot placeholder</title>
  <desc id="desc">Annotated placeholder for Cloud Run environment variables.</desc>
  <rect width="1120" height="630" fill="#f8fafc"/>
  <rect x="0" y="0" width="1120" height="64" fill="#1a73e8"/>
  <text x="32" y="40" font-family="Arial, sans-serif" font-size="24" fill="#fff">Cloud Run - Variables and secrets</text>
  <rect x="64" y="104" width="992" height="440" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="96" y="146" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#24292f">Gateway service variables</text>
  <g font-family="Arial, sans-serif" font-size="15">
    <text x="96" y="198" fill="#24292f">DISCOVERY_MODE</text><text x="420" y="198" fill="#57606a">cloudrun</text>
    <text x="96" y="236" fill="#24292f">GCP_PROJECT_ID</text><text x="420" y="236" fill="#57606a">project-id</text>
    <text x="96" y="274" fill="#24292f">GCP_REGION</text><text x="420" y="274" fill="#57606a">europe-west3</text>
    <text x="96" y="312" fill="#24292f">GRAPH_NAME</text><text x="420" y="312" fill="#57606a">pet-shop</text>
    <text x="96" y="350" fill="#24292f">ADMIN_CONSOLE_ENABLED</text><text x="420" y="350" fill="#57606a">true</text>
    <text x="96" y="388" fill="#24292f">SUPER_ADMIN_ID</text><text x="420" y="388" fill="#57606a">admin@example.com</text>
  </g>
  <text x="64" y="600" font-family="Arial, sans-serif" font-size="14" fill="#57606a">Capture the Variables and secrets tab for gateway and UI services after entering values.</text>
</svg>
