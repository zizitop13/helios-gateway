name: Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/pages.yml
      - scripts/restore-report-history*
  workflow_dispatch:
  workflow_run:
    workflows: [Quality]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Find completed quality report
        id: report
        uses: actions/github-script@v7
        with:
          script: |
            let runs = [context.payload.workflow_run];
            if (!runs[0]) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'quality.yml',
                branch: 'main',
                status: 'completed',
                per_page: 20,
              });
              runs = data.workflow_runs;
            }
            for (const run of runs) {
              if (run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                  run.head_branch !== 'main' || !['push', 'workflow_dispatch'].includes(run.event)) continue;
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo,
                run_id: run.id,
              });
              if (data.artifacts.some(artifact => artifact.name === 'quality-report' && !artifact.expired)) {
                core.setOutput('available', 'true');
                core.setOutput('run_id', run.id);
                core.setOutput('build_number', run.run_number);
                return;
              }
            }
            core.setOutput('available', 'false');
            core.notice('No available Quality report; publishing the existing report archive.');

      - name: Download quality report from the completed run
        if: steps.report.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: quality-report
          path: incoming-reports
          run-id: ${{ steps.report.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check report history restoration
        run: node --test scripts/restore-report-history.test.mjs

      - name: Restore persistent report history
        run: bash scripts/restore-report-history.sh

      - name: Archive new reports without replacing previous builds
        if: steps.report.outputs.available == 'true'
        run: |
          node scripts/archive-reports.mjs incoming-reports .report-history/reports
          git -C .report-history config user.name github-actions[bot]
          git -C .report-history config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C .report-history add reports
          if ! git -C .report-history diff --cached --quiet; then
            git -C .report-history commit -m "Archive quality reports for build ${{ steps.report.outputs.build_number }}"
            git -C .report-history push origin HEAD:refs/heads/quality-reports
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Include all archived quality reports
        run: |
          if [ -d .report-history/reports ]; then
            cp -R .report-history/reports ./_site/reports
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - uses: actions/deploy-pages@v4
        id: deployment
