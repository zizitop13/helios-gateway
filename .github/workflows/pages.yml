name: Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_run:
    workflows: [Quality]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Find completed quality report
        id: report
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            core.setOutput('available', data.artifacts.some(artifact => artifact.name === 'quality-report' && !artifact.expired));

      - name: Download quality report from the completed run
        if: steps.report.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: quality-report
          path: incoming-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore persistent report history
        run: |
          if git ls-remote --exit-code --heads origin quality-reports; then
            git fetch --depth=1 origin quality-reports
            git worktree add --detach .report-history FETCH_HEAD
          else
            git worktree add --detach .report-history HEAD
            git -C .report-history switch --orphan quality-reports
          fi

      - name: Archive new reports without replacing previous builds
        if: steps.report.outputs.available == 'true'
        run: |
          node scripts/archive-reports.mjs incoming-reports .report-history/reports
          git -C .report-history config user.name github-actions[bot]
          git -C .report-history config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C .report-history add reports
          if ! git -C .report-history diff --cached --quiet; then
            git -C .report-history commit -m "Archive quality reports for build ${{ github.event.workflow_run.run_number }}"
            git -C .report-history push origin HEAD:quality-reports
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Include all archived quality reports
        run: |
          if [ -d .report-history/reports ]; then
            cp -R .report-history/reports ./_site/reports
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - uses: actions/deploy-pages@v4
        id: deployment
