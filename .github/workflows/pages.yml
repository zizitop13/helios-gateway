name: Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/pages.yml
      - scripts/restore-report-history*
  workflow_dispatch:
  workflow_run:
    workflows: [Quality]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Find completed quality report
        id: report
        uses: actions/github-script@v7
        with:
          script: |
            let runs = [context.payload.workflow_run];
            if (!runs[0]) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'quality.yml',
                branch: 'main',
                status: 'completed',
                per_page: 20,
              });
              runs = data.workflow_runs;
            }
            for (const run of runs) {
              if (run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                  run.head_branch !== 'main' || !['push', 'workflow_dispatch'].includes(run.event)) continue;
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo,
                run_id: run.id,
              });
              if (data.artifacts.some(artifact => artifact.name === 'quality-report' && !artifact.expired)) {
                core.setOutput('available', 'true');
                core.setOutput('run_id', run.id);
                core.setOutput('build_number', run.run_number);
                return;
              }
            }
            core.setOutput('available', 'false');
            core.notice('No available Quality report; publishing the existing report archive.');

      - name: Download quality report from the completed run
        if: steps.report.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: quality-report
          path: incoming-reports
          run-id: ${{ steps.report.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check report history restoration
        run: node --test scripts/restore-report-history.test.mjs

      - name: Restore persistent report history
        run: bash scripts/restore-report-history.sh

      - name: Archive new reports without replacing previous builds
        if: steps.report.outputs.available == 'true'
        run: |
          node scripts/archive-reports.mjs incoming-reports .report-history/reports
          git -C .report-history config user.name github-actions[bot]
          git -C .report-history config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C .report-history add reports
          if ! git -C .report-history diff --cached --quiet; then
            git -C .report-history commit -m "Archive quality reports for build ${{ steps.report.outputs.build_number }}"
            git -C .report-history push origin HEAD:refs/heads/quality-reports
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Include all archived quality reports
        run: |
          if [ -d .report-history/reports ]; then
            # The Jekyll container creates a root-owned output directory.
            sudo cp -R .report-history/reports ./_site/reports
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./_site

      - name: Wait for competing branch-based Pages builds
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 40; attempt++) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/actions/runs', {
                ...context.repo,
                head_sha: context.sha,
                per_page: 100,
              });
              const active = data.workflow_runs.some(run =>
                run.name === 'pages build and deployment' &&
                run.event === 'dynamic' && run.status !== 'completed');
              if (!active) return;
              if (attempt === 39) throw new Error('The branch-based Pages build did not finish.');
              core.info('Waiting for the built-in Pages deployment before publishing reports.');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }

      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify published quality report
        if: steps.report.outputs.available == 'true'
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          REPORT_BUILD: ${{ steps.report.outputs.build_number }}
        run: |
          node --input-type=module <<'JS'
          import { setTimeout as delay } from 'node:timers/promises';
          const url = new URL('reports/', process.env.PAGES_URL);
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
            const body = await response.text();
            if (response.ok && body.includes('Quality report history') &&
                body.includes(`build ${process.env.REPORT_BUILD} `)) {
              console.log(`Verified quality report: ${url}`);
              break;
            }
            if (attempt === 11) throw new Error(`Quality report is unavailable at ${url} (HTTP ${response.status}).`);
            await delay(5000);
          }
          JS
