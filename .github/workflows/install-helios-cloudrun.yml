name: Install Helios Gateway on Cloud Run

on:
  workflow_call:
    inputs:
      project_id:
        description: Google Cloud project ID.
        required: true
        type: string
      region:
        description: Google Cloud Run region.
        required: false
        type: string
        default: europe-west3
      discovery_mode:
        description: Gateway subgraph discovery mode (cloudrun, docker, or file). cloudrun is the default and uses Cloud Run service discovery. docker uses Docker image discovery. file uses a local schema file.
        required: false
        type: string
        default: cloudrun
      graph_name:
        description: Graph scope label value used by the gateway discovery filter.
        required: false
        type: string
        default: pet-shop
      graph_label_key:
        description: Graph scope label key used by the gateway discovery filter.
        required: false
        type: string
        default: graph
      super_admin_id:
        description: Firebase UID or email for first Admin Console access.
        required: true
        type: string
      firebase_project_id:
        description: Firebase project ID. Defaults to project_id when empty.
        required: false
        type: string
        default: ""
      firebase_api_key:
        description: Firebase Web App apiKey.
        required: true
        type: string
      firebase_auth_domain:
        description: Firebase Web App authDomain.
        required: true
        type: string
      firebase_storage_bucket:
        description: Firebase Web App storageBucket.
        required: false
        type: string
        default: ""
      firebase_messaging_sender_id:
        description: Firebase Web App messagingSenderId.
        required: false
        type: string
        default: ""
      firebase_app_id:
        description: Firebase Web App appId.
        required: true
        type: string
      firebase_measurement_id:
        description: Firebase Web App measurementId.
        required: false
        type: string
        default: ""
      allow_unauthenticated:
        description: Expose the gateway Cloud Run service publicly.
        required: false
        type: boolean
        default: true
      create_runtime_service_account:
        description: Create/use a gateway runtime service account and grant Cloud Run/Firebase roles.
        required: false
        type: boolean
        default: true
      runtime_service_account:
        description: Runtime service account email. Empty creates/uses helios-gateway-runtime.
        required: false
        type: string
        default: ""
      enable_required_apis:
        description: Enable required Google APIs before deployment.
        required: false
        type: boolean
        default: true
      enable_cloud_run_iam_auth:
        description: Attach identity tokens when the gateway calls IAM-protected Cloud Run subgraphs.
        required: false
        type: boolean
        default: false
      enable_apollo_sandbox:
        description: Enable Apollo Sandbox.
        required: false
        type: boolean
        default: true
      enable_schema_refresh:
        description: Enable gateway schema refresh.
        required: false
        type: boolean
        default: true
      schema_refresh_interval_seconds:
        description: Gateway schema refresh interval.
        required: false
        type: string
        default: "30"
      gateway_service_name:
        description: Cloud Run service name for Helios Gateway.
        required: false
        type: string
        default: helios-gateway
      gateway_image:
        description: Container image for Helios Gateway.
        required: false
        type: string
        default: docker.io/zizitop13/helios-gateway:latest
    secrets:
      GCP_SA_KEY:
        description: Google service account JSON with permission to deploy Cloud Run and manage IAM.
        required: true
    outputs:
      gateway_url:
        description: Deployed gateway URL.
        value: ${{ jobs.install.outputs.gateway_url }}

permissions:
  contents: read
  id-token: write

jobs:
  install:
    runs-on: ubuntu-latest
    outputs:
      gateway_url: ${{ steps.deploy.outputs.gateway_url }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ inputs.project_id }}

      - name: Deploy Helios Gateway
        id: deploy
        shell: bash
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          REGION: ${{ inputs.region }}
          DISCOVERY_MODE: ${{ inputs.discovery_mode }}
          GRAPH_NAME: ${{ inputs.graph_name }}
          GRAPH_LABEL_KEY: ${{ inputs.graph_label_key }}
          SUPER_ADMIN_ID: ${{ inputs.super_admin_id }}
          FIREBASE_PROJECT_ID_INPUT: ${{ inputs.firebase_project_id }}
          FIREBASE_API_KEY: ${{ inputs.firebase_api_key }}
          FIREBASE_AUTH_DOMAIN: ${{ inputs.firebase_auth_domain }}
          FIREBASE_STORAGE_BUCKET: ${{ inputs.firebase_storage_bucket }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ inputs.firebase_messaging_sender_id }}
          FIREBASE_APP_ID: ${{ inputs.firebase_app_id }}
          FIREBASE_MEASUREMENT_ID: ${{ inputs.firebase_measurement_id }}
          ALLOW_UNAUTHENTICATED: ${{ inputs.allow_unauthenticated }}
          CREATE_RUNTIME_SERVICE_ACCOUNT: ${{ inputs.create_runtime_service_account }}
          RUNTIME_SERVICE_ACCOUNT_INPUT: ${{ inputs.runtime_service_account }}
          ENABLE_REQUIRED_APIS: ${{ inputs.enable_required_apis }}
          ENABLE_CLOUD_RUN_IAM_AUTH: ${{ inputs.enable_cloud_run_iam_auth }}
          ENABLE_APOLLO_SANDBOX: ${{ inputs.enable_apollo_sandbox }}
          ENABLE_SCHEMA_REFRESH: ${{ inputs.enable_schema_refresh }}
          SCHEMA_REFRESH_INTERVAL_SECONDS: ${{ inputs.schema_refresh_interval_seconds }}
          GATEWAY_SERVICE_NAME: ${{ inputs.gateway_service_name }}
          GATEWAY_IMAGE: ${{ inputs.gateway_image }}
        run: |
          set -euo pipefail

          require_input() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error::$name is required"
              exit 1
            fi
          }

          bool_flag() {
            case "$1" in
              true|false) ;;
              *) echo "::error::Boolean input must be 'true' or 'false', got '$1'"; exit 1 ;;
            esac
          }

          discovery_mode() {
            case "$1" in
              cloudrun|docker|file) ;;
              *) echo "::error::discovery_mode must be 'cloudrun', 'docker', or 'file', got '$1'"; exit 1 ;;
            esac
          }

          require_input project_id "$PROJECT_ID"
          require_input region "$REGION"
          require_input discovery_mode "$DISCOVERY_MODE"
          require_input super_admin_id "$SUPER_ADMIN_ID"
          require_input firebase_api_key "$FIREBASE_API_KEY"
          require_input firebase_auth_domain "$FIREBASE_AUTH_DOMAIN"
          require_input firebase_app_id "$FIREBASE_APP_ID"
          discovery_mode "$DISCOVERY_MODE"
          bool_flag "$ALLOW_UNAUTHENTICATED"
          bool_flag "$CREATE_RUNTIME_SERVICE_ACCOUNT"
          bool_flag "$ENABLE_REQUIRED_APIS"
          bool_flag "$ENABLE_CLOUD_RUN_IAM_AUTH"
          bool_flag "$ENABLE_APOLLO_SANDBOX"
          bool_flag "$ENABLE_SCHEMA_REFRESH"

          FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID_INPUT:-$PROJECT_ID}"
          ALLOW_FLAG="--no-allow-unauthenticated"
          if [ "$ALLOW_UNAUTHENTICATED" = "true" ]; then
            ALLOW_FLAG="--allow-unauthenticated"
          fi

          gateway_labels="app=$GATEWAY_SERVICE_NAME"
          if [ -n "$GRAPH_NAME" ]; then
            gateway_labels="$gateway_labels,$GRAPH_LABEL_KEY=$GRAPH_NAME"
          fi

          gateway_env="^|^DISCOVERY_MODE=$DISCOVERY_MODE|GCP_PROJECT_ID=$PROJECT_ID|GCP_REGION=$REGION|FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID|GRAPH_NAME=$GRAPH_NAME|GRAPH_LABEL_KEY=$GRAPH_LABEL_KEY|SUPER_ADMIN_ID=$SUPER_ADMIN_ID|ADMIN_CONSOLE_ENABLED=true|ADMIN_CONSOLE_FIREBASE_API_KEY=$FIREBASE_API_KEY|ADMIN_CONSOLE_FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN|ADMIN_CONSOLE_FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID|ADMIN_CONSOLE_FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET|ADMIN_CONSOLE_FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID|ADMIN_CONSOLE_FIREBASE_APP_ID=$FIREBASE_APP_ID|ADMIN_CONSOLE_FIREBASE_MEASUREMENT_ID=$FIREBASE_MEASUREMENT_ID|ENABLE_CLOUD_RUN_IAM_AUTH=$ENABLE_CLOUD_RUN_IAM_AUTH|ENABLE_APOLLO_SANDBOX=$ENABLE_APOLLO_SANDBOX|ENABLE_SCHEMA_REFRESH=$ENABLE_SCHEMA_REFRESH|SCHEMA_REFRESH_INTERVAL_SECONDS=$SCHEMA_REFRESH_INTERVAL_SECONDS"

          gcloud run deploy "$GATEWAY_SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --image "$GATEWAY_IMAGE" \
            --port 4000 \
            $ALLOW_FLAG \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            "${service_account_args[@]}" \
            --labels "$gateway_labels" \
            --set-env-vars "$gateway_env"

          gateway_url="$(service_url "$GATEWAY_SERVICE_NAME")"
          echo "gateway_url=$gateway_url" >> "$GITHUB_OUTPUT"

          {
            echo "## Helios Cloud Run installation"
            echo ""
            echo "- Gateway: $gateway_url"
            echo "- Admin Console: $gateway_url/admin/console/"
            echo "- GraphQL: $gateway_url/graphql"
            echo ""
            echo "Discovery mode: $DISCOVERY_MODE"
            if [ "$DISCOVERY_MODE" = "cloudrun" ]; then
              echo ""
              echo "The gateway discovers Cloud Run subgraphs in project '$PROJECT_ID' and region '$REGION' with labels:"
              echo "- subgraph=true"
              if [ -n "$GRAPH_NAME" ]; then
                echo "- $GRAPH_LABEL_KEY=$GRAPH_NAME"
              fi
            fi
            echo ""
            echo "Add this hostname to Firebase Authentication authorized domains:"
            echo "- ${gateway_url#https://}"
          } >> "$GITHUB_STEP_SUMMARY"
