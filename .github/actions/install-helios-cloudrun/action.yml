name: Install Helios Gateway on Cloud Run
description: Deploy Helios Gateway, pet-shop subgraphs, and optional demo UI to a Google Cloud project.

inputs:
  credentials_json:
    description: Google service account JSON used by google-github-actions/auth.
    required: true
  project_id:
    description: Google Cloud project ID.
    required: true
  region:
    description: Google Cloud Run region.
    required: true
  graph_name:
    description: Graph scope label value used by the gateway discovery filter.
    required: false
    default: pet-shop
  graph_label_key:
    description: Label key used for graph scoping.
    required: false
    default: graph
  super_admin_id:
    description: Firebase UID or email allowed to access Admin Console before custom roles are assigned.
    required: true
  firebase_project_id:
    description: Firebase project ID. Defaults to project_id when empty.
    required: false
    default: ""
  firebase_api_key:
    description: Firebase Web App apiKey.
    required: true
  firebase_auth_domain:
    description: Firebase Web App authDomain.
    required: true
  firebase_storage_bucket:
    description: Firebase Web App storageBucket.
    required: false
    default: ""
  firebase_messaging_sender_id:
    description: Firebase Web App messagingSenderId.
    required: false
    default: ""
  firebase_app_id:
    description: Firebase Web App appId.
    required: true
  firebase_measurement_id:
    description: Firebase Web App measurementId.
    required: false
    default: ""
  allow_unauthenticated:
    description: Whether to expose Cloud Run services publicly.
    required: false
    default: "true"
  deploy_ui:
    description: Whether to deploy the pets-shop-ui service.
    required: false
    default: "true"
  create_runtime_service_account:
    description: Create/use a runtime service account for the gateway and grant Cloud Run/Firebase roles.
    required: false
    default: "true"
  runtime_service_account:
    description: Runtime service account email. When empty and create_runtime_service_account is true, helios-gateway-runtime is used.
    required: false
    default: ""
  enable_required_apis:
    description: Enable Cloud Run and related Google APIs before deployment.
    required: false
    default: "true"
  enable_apollo_sandbox:
    description: Enable Apollo Sandbox on the gateway /graphql endpoint.
    required: false
    default: "true"
  enable_schema_refresh:
    description: Enable periodic subgraph rediscovery/schema refresh.
    required: false
    default: "true"
  schema_refresh_interval_seconds:
    description: Gateway schema refresh interval.
    required: false
    default: "30"
  gateway_service_name:
    description: Cloud Run service name for Helios Gateway.
    required: false
    default: helios-gateway
  pets_service_name:
    description: Cloud Run service name for pets subgraph.
    required: false
    default: pets-service
  orders_service_name:
    description: Cloud Run service name for orders subgraph.
    required: false
    default: orders-service
  customers_service_name:
    description: Cloud Run service name for customers subgraph.
    required: false
    default: customers-service
  ui_service_name:
    description: Cloud Run service name for the demo UI.
    required: false
    default: pets-shop-ui
  gateway_image:
    description: Container image for Helios Gateway.
    required: false
    default: docker.io/zizitop13/helios-gateway:latest
  pets_image:
    description: Container image for pets-service.
    required: false
    default: docker.io/zizitop13/helios-gateway-pets-service:latest
  orders_image:
    description: Container image for orders-service.
    required: false
    default: docker.io/zizitop13/helios-gateway-orders-service:latest
  customers_image:
    description: Container image for customers-service.
    required: false
    default: docker.io/zizitop13/helios-gateway-customers-service:latest
  ui_image:
    description: Container image for pets-shop-ui.
    required: false
    default: docker.io/zizitop13/helios-gateway-pets-shop-ui:latest

outputs:
  gateway_url:
    description: Deployed gateway URL.
    value: ${{ steps.deploy.outputs.gateway_url }}
  pets_service_url:
    description: Deployed pets-service URL.
    value: ${{ steps.deploy.outputs.pets_service_url }}
  orders_service_url:
    description: Deployed orders-service URL.
    value: ${{ steps.deploy.outputs.orders_service_url }}
  customers_service_url:
    description: Deployed customers-service URL.
    value: ${{ steps.deploy.outputs.customers_service_url }}
  ui_url:
    description: Deployed UI URL, when deploy_ui is true.
    value: ${{ steps.deploy.outputs.ui_url }}

runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ inputs.credentials_json }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ inputs.project_id }}

    - name: Deploy Helios Gateway demo stack
      id: deploy
      shell: bash
      env:
        PROJECT_ID: ${{ inputs.project_id }}
        REGION: ${{ inputs.region }}
        GRAPH_NAME: ${{ inputs.graph_name }}
        GRAPH_LABEL_KEY: ${{ inputs.graph_label_key }}
        SUPER_ADMIN_ID: ${{ inputs.super_admin_id }}
        FIREBASE_PROJECT_ID_INPUT: ${{ inputs.firebase_project_id }}
        FIREBASE_API_KEY: ${{ inputs.firebase_api_key }}
        FIREBASE_AUTH_DOMAIN: ${{ inputs.firebase_auth_domain }}
        FIREBASE_STORAGE_BUCKET: ${{ inputs.firebase_storage_bucket }}
        FIREBASE_MESSAGING_SENDER_ID: ${{ inputs.firebase_messaging_sender_id }}
        FIREBASE_APP_ID: ${{ inputs.firebase_app_id }}
        FIREBASE_MEASUREMENT_ID: ${{ inputs.firebase_measurement_id }}
        ALLOW_UNAUTHENTICATED: ${{ inputs.allow_unauthenticated }}
        DEPLOY_UI: ${{ inputs.deploy_ui }}
        CREATE_RUNTIME_SERVICE_ACCOUNT: ${{ inputs.create_runtime_service_account }}
        RUNTIME_SERVICE_ACCOUNT_INPUT: ${{ inputs.runtime_service_account }}
        ENABLE_REQUIRED_APIS: ${{ inputs.enable_required_apis }}
        ENABLE_APOLLO_SANDBOX: ${{ inputs.enable_apollo_sandbox }}
        ENABLE_SCHEMA_REFRESH: ${{ inputs.enable_schema_refresh }}
        SCHEMA_REFRESH_INTERVAL_SECONDS: ${{ inputs.schema_refresh_interval_seconds }}
        GATEWAY_SERVICE_NAME: ${{ inputs.gateway_service_name }}
        PETS_SERVICE_NAME: ${{ inputs.pets_service_name }}
        ORDERS_SERVICE_NAME: ${{ inputs.orders_service_name }}
        CUSTOMERS_SERVICE_NAME: ${{ inputs.customers_service_name }}
        UI_SERVICE_NAME: ${{ inputs.ui_service_name }}
        GATEWAY_IMAGE: ${{ inputs.gateway_image }}
        PETS_IMAGE: ${{ inputs.pets_image }}
        ORDERS_IMAGE: ${{ inputs.orders_image }}
        CUSTOMERS_IMAGE: ${{ inputs.customers_image }}
        UI_IMAGE: ${{ inputs.ui_image }}
      run: |
        set -euo pipefail

        require_input() {
          local name="$1"
          local value="$2"
          if [ -z "$value" ]; then
            echo "::error::$name is required"
            exit 1
          fi
        }

        bool_flag() {
          case "$1" in
            true|false) ;;
            *) echo "::error::Boolean input must be 'true' or 'false', got '$1'"; exit 1 ;;
          esac
        }

        require_input project_id "$PROJECT_ID"
        require_input region "$REGION"
        require_input super_admin_id "$SUPER_ADMIN_ID"
        require_input firebase_api_key "$FIREBASE_API_KEY"
        require_input firebase_auth_domain "$FIREBASE_AUTH_DOMAIN"
        require_input firebase_app_id "$FIREBASE_APP_ID"
        bool_flag "$ALLOW_UNAUTHENTICATED"
        bool_flag "$DEPLOY_UI"
        bool_flag "$CREATE_RUNTIME_SERVICE_ACCOUNT"
        bool_flag "$ENABLE_REQUIRED_APIS"
        bool_flag "$ENABLE_APOLLO_SANDBOX"
        bool_flag "$ENABLE_SCHEMA_REFRESH"

        FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID_INPUT:-$PROJECT_ID}"
        ALLOW_FLAG="--no-allow-unauthenticated"
        if [ "$ALLOW_UNAUTHENTICATED" = "true" ]; then
          ALLOW_FLAG="--allow-unauthenticated"
        fi

        if [ "$ENABLE_REQUIRED_APIS" = "true" ]; then
          gcloud services enable \
            run.googleapis.com \
            cloudresourcemanager.googleapis.com \
            iam.googleapis.com \
            firebase.googleapis.com \
            identitytoolkit.googleapis.com \
            --project "$PROJECT_ID"
        fi

        RUNTIME_SA_EMAIL="$RUNTIME_SERVICE_ACCOUNT_INPUT"
        if [ "$CREATE_RUNTIME_SERVICE_ACCOUNT" = "true" ]; then
          if [ -z "$RUNTIME_SA_EMAIL" ]; then
            RUNTIME_SA_EMAIL="helios-gateway-runtime@$PROJECT_ID.iam.gserviceaccount.com"
          fi

          SA_NAME="${RUNTIME_SA_EMAIL%@*}"
          if ! gcloud iam service-accounts describe "$RUNTIME_SA_EMAIL" --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud iam service-accounts create "$SA_NAME" \
              --project "$PROJECT_ID" \
              --display-name "Helios Gateway Runtime"
          fi

          for role in roles/run.viewer roles/firebaseauth.admin; do
            gcloud projects add-iam-policy-binding "$PROJECT_ID" \
              --member "serviceAccount:$RUNTIME_SA_EMAIL" \
              --role "$role" \
              --quiet >/dev/null
          done
        fi

        service_account_args=()
        if [ -n "$RUNTIME_SA_EMAIL" ]; then
          service_account_args=(--service-account "$RUNTIME_SA_EMAIL")
        fi

        deploy_subgraph() {
          local service="$1"
          local image="$2"
          local port="$3"
          local subgraph_name="$4"

          gcloud run deploy "$service" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --image "$image" \
            --port "$port" \
            $ALLOW_FLAG \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --labels "app=$service,subgraph=true,subgraph_name=$subgraph_name,$GRAPH_LABEL_KEY=$GRAPH_NAME"
        }

        service_url() {
          gcloud run services describe "$1" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format 'value(status.url)'
        }

        deploy_subgraph "$PETS_SERVICE_NAME" "$PETS_IMAGE" "5001" "$PETS_SERVICE_NAME"
        deploy_subgraph "$ORDERS_SERVICE_NAME" "$ORDERS_IMAGE" "5002" "$ORDERS_SERVICE_NAME"
        deploy_subgraph "$CUSTOMERS_SERVICE_NAME" "$CUSTOMERS_IMAGE" "5003" "$CUSTOMERS_SERVICE_NAME"

        gateway_env="^|^DISCOVERY_MODE=cloudrun|GCP_PROJECT_ID=$PROJECT_ID|GCP_REGION=$REGION|FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID|GRAPH_NAME=$GRAPH_NAME|GRAPH_LABEL_KEY=$GRAPH_LABEL_KEY|SUPER_ADMIN_ID=$SUPER_ADMIN_ID|ADMIN_CONSOLE_ENABLED=true|ADMIN_CONSOLE_FIREBASE_API_KEY=$FIREBASE_API_KEY|ADMIN_CONSOLE_FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN|ADMIN_CONSOLE_FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID|ADMIN_CONSOLE_FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET|ADMIN_CONSOLE_FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID|ADMIN_CONSOLE_FIREBASE_APP_ID=$FIREBASE_APP_ID|ADMIN_CONSOLE_FIREBASE_MEASUREMENT_ID=$FIREBASE_MEASUREMENT_ID|ENABLE_APOLLO_SANDBOX=$ENABLE_APOLLO_SANDBOX|ENABLE_SCHEMA_REFRESH=$ENABLE_SCHEMA_REFRESH|SCHEMA_REFRESH_INTERVAL_SECONDS=$SCHEMA_REFRESH_INTERVAL_SECONDS"

        gcloud run deploy "$GATEWAY_SERVICE_NAME" \
          --project "$PROJECT_ID" \
          --region "$REGION" \
          --platform managed \
          --image "$GATEWAY_IMAGE" \
          --port 4000 \
          $ALLOW_FLAG \
          --memory 512Mi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 10 \
          "${service_account_args[@]}" \
          --labels "app=$GATEWAY_SERVICE_NAME,$GRAPH_LABEL_KEY=$GRAPH_NAME" \
          --set-env-vars "$gateway_env"

        gateway_url="$(service_url "$GATEWAY_SERVICE_NAME")"
        ui_url=""

        if [ "$DEPLOY_UI" = "true" ]; then
          require_input firebase_storage_bucket "$FIREBASE_STORAGE_BUCKET"
          require_input firebase_messaging_sender_id "$FIREBASE_MESSAGING_SENDER_ID"

          ui_env="^|^VITE_GATEWAY_URL=$gateway_url|VITE_FIREBASE_API_KEY=$FIREBASE_API_KEY|VITE_FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN|VITE_FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID|VITE_FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET|VITE_FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID|VITE_FIREBASE_APP_ID=$FIREBASE_APP_ID|VITE_FIREBASE_MEASUREMENT_ID=$FIREBASE_MEASUREMENT_ID"

          gcloud run deploy "$UI_SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --image "$UI_IMAGE" \
            --port 8080 \
            $ALLOW_FLAG \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --labels "app=$UI_SERVICE_NAME,$GRAPH_LABEL_KEY=$GRAPH_NAME" \
            --set-env-vars "$ui_env"

          ui_url="$(service_url "$UI_SERVICE_NAME")"
        fi

        pets_url="$(service_url "$PETS_SERVICE_NAME")"
        orders_url="$(service_url "$ORDERS_SERVICE_NAME")"
        customers_url="$(service_url "$CUSTOMERS_SERVICE_NAME")"

        {
          echo "gateway_url=$gateway_url"
          echo "pets_service_url=$pets_url"
          echo "orders_service_url=$orders_url"
          echo "customers_service_url=$customers_url"
          echo "ui_url=$ui_url"
        } >> "$GITHUB_OUTPUT"

        {
          echo "## Helios Cloud Run installation"
          echo ""
          echo "- Gateway: $gateway_url"
          echo "- Admin Console: $gateway_url/admin/console/"
          echo "- GraphQL: $gateway_url/graphql"
          echo "- Pets service: $pets_url"
          echo "- Orders service: $orders_url"
          echo "- Customers service: $customers_url"
          if [ -n "$ui_url" ]; then
            echo "- Pets Shop UI: $ui_url"
          fi
          echo ""
          echo "Add these hostnames to Firebase Authentication authorized domains:"
          echo "- ${gateway_url#https://}"
          if [ -n "$ui_url" ]; then
            echo "- ${ui_url#https://}"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
